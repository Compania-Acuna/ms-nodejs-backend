  name: Build

  on:
    push:
      branches:
        - main

  jobs:
    build:
      name: CI
      environment: dev
      runs-on: ubuntu-latest

      steps:
        - name: Obtener código fuente
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Obtener SHA corto
          id: short
          run: echo "short_sha=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

        - name: Configurar Node.js
          uses: actions/setup-node@v4
          with:
            node-version: "20"
            cache: npm

        - name: Instalar dependencias
          run: npm install

        - name: Ejecutar pruebas unitarias
          run: npm run test:unit

        - name: Ejecutar pruebas de integración
          run: npm run test:integration

        - name: Crear proyecto en SonarQube si no existe
          env:
            SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          run: |
            PROJECT_KEY="my-nodejs-app"
            PROJECT_NAME="My NodeJS App"

            TOTAL=$(curl --fail --silent --show-error \
              --user "${SONAR_TOKEN}:" \
              "${SONAR_HOST_URL}/api/projects/search?projects=${PROJECT_KEY}" |
              jq -r '.paging.total')

            if [ "$TOTAL" -eq 0 ]; then
              echo "Creando proyecto en SonarQube..."
              curl --fail --silent --show-error \
                --user "${SONAR_TOKEN}:" \
                --request POST \
                "${SONAR_HOST_URL}/api/projects/create" \
                --data-urlencode "name=${PROJECT_NAME}" \
                --data-urlencode "project=${PROJECT_KEY}"
            else
              echo "El proyecto ya existe."
            fi

        - name: Analizar con SonarQube
          uses: SonarSource/sonarqube-scan-action@v6
          with:
            args: >
              -Dsonar.projectKey=my-nodejs-app
              -Dsonar.projectName=My_NodeJS_App
              -Dsonar.sources=.
              -Dsonar.exclusions=node_modules/**,coverage/**
              -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

        - name: Crear archivo ZIP
          run: zip -r build-artifact.zip . -x "node_modules/*" ".git/*"

        - name: Subir artefacto ZIP
          uses: actions/upload-artifact@v4
          with:
            name: build-artifact
            path: build-artifact.zip

        - name: Configurar credenciales del Registry
          run: echo "[To-Do] Autenticar en Registry"

        - name: Construir y subir imagen Docker
          run: echo "[To-Do] Generar imagen"
