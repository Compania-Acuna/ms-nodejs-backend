  name: Build Deploy Flow

  on:
    workflow_dispatch:
      inputs:
        ambiente:
          description: Selecciona el ambiente
          required: true
          type: choice
          options:
            - dev
            - qa
            - prd

        nombre:
          description: Nombre de la aplicación
          required: true
          type: string

  jobs:
    build:
      name: Build
      runs-on: ubuntu-latest

      steps:
        - name: Step 1 - Construir aplicación
          run: echo "Construyendo app ${{ inputs.nombre }}"

        - name: Step 2 - Aplicación construida
          run: echo "App ${{ inputs.nombre }} construida"

    deploy:
      name: Deploy
      runs-on: ubuntu-latest
      needs: build

      steps:
        - name: Step 1 - Desplegar
          run: echo "Desplegando en ambiente ${{ inputs.ambiente }}"

        - name: Step 2 - Confirmar despliegue
          run: echo "Aplicación ${{ inputs.nombre }} desplegada en ${{ inputs.ambiente }}"

        - name: Construir y subir imagen Docker
          run: echo "[To-Do] Generar imagen"
